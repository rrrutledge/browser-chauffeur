name: safe-compounds tests

on:
  push:
    paths:
      - 'plugins/safe-compounds/**'
      - '.github/workflows/safe-compounds-tests.yml'
  pull_request:
    paths:
      - 'plugins/safe-compounds/**'
      - '.github/workflows/safe-compounds-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/safe-compounds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run tests
        run: python -m pytest
